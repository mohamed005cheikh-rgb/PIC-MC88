<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="midnight">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PIC by MC88 | Professional Image Studio</title>
    <meta name="description" content="Professional browser-based image processing. 100% client-side. Your images never leave your device.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --font-display: 'Playfair Display', Georgia, serif;
            --font-body: 'Inter', system-ui, -apple-system, sans-serif;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s ease;
        }
        html[data-theme="midnight"] {
            --bg: #080812;
            --panel: rgba(16,16,30,0.94);
            --panel2: rgba(24,24,44,0.88);
            --text: #eeeef5;
            --muted: #8a8aaa;
            --line: rgba(255,255,255,0.06);
            --line2: rgba(255,255,255,0.10);
            --accent: #b794f4;
            --accent2: #7c3aed;
            --glow: rgba(183,148,244,0.4);
            --glow2: rgba(183,148,244,0.65);
            --good: #4ade80;
            --danger: #f87171;
            --shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        html[data-theme="gray"] {
            --bg: #1a1a1f;
            --panel: rgba(28,28,34,0.94);
            --panel2: rgba(38,38,46,0.88);
            --text: #e8e8ed;
            --muted: #8a8a98;
            --line: rgba(255,255,255,0.05);
            --line2: rgba(255,255,255,0.09);
            --accent: #a8a8c0;
            --accent2: #70708a;
            --glow: rgba(168,168,192,0.35);
            --glow2: rgba(168,168,192,0.55);
            --good: #5cce8a;
            --danger: #e07070;
            --shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        html[data-theme="light"] {
            --bg: #f4f2f8;
            --panel: rgba(255,255,255,0.94);
            --panel2: rgba(248,247,252,0.88);
            --text: #1a1a2e;
            --muted: #7a7698;
            --line: rgba(0,0,0,0.06);
            --line2: rgba(0,0,0,0.09);
            --accent: #7c5ce7;
            --accent2: #5a3fc0;
            --glow: rgba(124,92,231,0.25);
            --glow2: rgba(124,92,231,0.45);
            --good: #22c55e;
            --danger: #ef4444;
            --shadow: 0 20px 60px rgba(0,0,0,0.08);
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(ellipse at 50% 0%, var(--glow) 0%, transparent 55%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%);
        }
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* HEADER */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 50;
            flex-shrink: 0;
            gap: 10px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .camera-icon {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            font-size: 17px;
            color: var(--accent);
            filter: drop-shadow(0 0 8px var(--glow));
            transition: var(--transition);
            cursor: pointer;
        }
        .camera-icon:active {
            transform: scale(0.88);
        }
        .brand b {
            font-size: 14px;
            font-family: var(--font-display);
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        /* COPYRIGHT NEON */
        .copyright-neon {
            font-size: 9px;
            font-weight: 600;
            font-family: var(--font-body);
            letter-spacing: 0.6px;
            padding: 5px 14px;
            border-radius: 20px;
            background: rgba(0,0,0,0.3);
            border: 1px solid transparent;
            background-image: linear-gradient(var(--panel2), var(--panel2)),
                linear-gradient(135deg, var(--accent), var(--accent2), var(--accent));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            color: var(--accent);
            text-shadow: 0 0 8px var(--glow), 0 0 18px var(--glow2);
            box-shadow: 0 0 12px var(--glow), inset 0 0 6px var(--glow);
            animation: neonPulse 2.5s ease-in-out infinite;
            white-space: nowrap;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
        }
        @keyframes neonPulse {
            0%, 100% {
                box-shadow: 0 0 10px var(--glow), inset 0 0 4px var(--glow);
                text-shadow: 0 0 6px var(--glow), 0 0 14px var(--glow2);
            }
            50% {
                box-shadow: 0 0 20px var(--glow2), 0 0 30px var(--glow), inset 0 0 8px var(--glow);
                text-shadow: 0 0 10px var(--glow), 0 0 22px var(--glow2), 0 0 30px var(--glow);
            }
        }
        .copyright-neon i {
            margin-right: 3px;
            font-size: 8px;
            animation: sparkle 1.5s ease-in-out infinite;
        }
        @keyframes sparkle {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .privacy-tag {
            font-size: 9px;
            color: var(--muted);
            border: 1px solid var(--line2);
            padding: 5px 10px;
            border-radius: 18px;
            background: var(--panel2);
            white-space: nowrap;
            font-weight: 500;
        }
        .privacy-tag i {
            color: var(--good);
            margin-right: 3px;
            font-size: 8px;
        }
        .theme-row {
            display: flex;
            gap: 3px;
            background: var(--panel2);
            padding: 3px;
            border-radius: 20px;
            border: 1px solid var(--line);
        }
        .theme-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            display: grid;
            place-items: center;
            font-size: 9px;
            transition: var(--transition);
        }
        .theme-dot:hover {
            transform: scale(1.08);
        }
        .theme-dot.active {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--glow);
        }
        .theme-dot.midnight {
            background: #1a1028;
            color: #b794f4;
        }
        .theme-dot.gray {
            background: #2a2a32;
            color: #a8a8c0;
        }
        .theme-dot.light {
            background: #f0edf5;
            color: #7c5ce7;
        }

        /* WORKSPACE */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        .sidebar {
            width: 300px;
            border-right: 1px solid var(--line);
            background: var(--panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 14px;
            gap: 12px;
            flex-shrink: 0;
            z-index: 15;
        }
        .section-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--muted);
            margin-bottom: 8px;
            font-weight: 700;
        }
        .tabs-row {
            display: flex;
            gap: 4px;
            background: var(--panel2);
            padding: 4px;
            border-radius: var(--radius-sm);
        }
        .tab-btn {
            flex: 1;
            padding: 8px 5px;
            text-align: center;
            font-size: 10px;
            font-weight: 600;
            color: var(--muted);
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: transparent;
            font-family: var(--font-body);
        }
        .tab-btn.active {
            background: var(--line2);
            color: var(--text);
        }
        .tab-panel {
            display: none;
        }
        .tab-panel.active {
            display: block;
        }

        /* SLIDERS */
        .slider-wrap {
            margin-bottom: 14px;
        }
        .slider-wrap label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--muted);
            margin-bottom: 5px;
            font-weight: 500;
        }
        .slider-wrap label span {
            color: var(--accent);
            font-weight: 600;
        }
        input[type=range] {
            width: 100%;
            height: 6px;
            border-radius: 6px;
            background: var(--line2);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
            margin-top: 4px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--bg);
            cursor: pointer;
            border: 3px solid var(--accent);
            box-shadow: 0 0 10px var(--glow), 0 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            border-color: var(--accent2);
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(0.95);
        }

        /* FILTERS */
        #tab-filters {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 160px);
        }
        .filter-search {
            width: 100%;
            padding: 10px 12px;
            background: var(--panel2);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 11px;
            margin-bottom: 8px;
            font-family: var(--font-body);
            outline: none;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .filter-search:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--glow);
        }
        .cat-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 8px;
            scrollbar-width: none;
            position: sticky;
            top: 42px;
            z-index: 9;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }
        .cat-row::-webkit-scrollbar {
            display: none;
        }
        .cat-chip {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--line);
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            background: var(--panel2);
            color: var(--muted);
            font-family: var(--font-body);
            transition: var(--transition);
        }
        .cat-chip:hover {
            color: var(--text);
            border-color: var(--line2);
        }
        .cat-chip.active {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        /* Custom Presets Section */
        .custom-presets-section {
            margin-top: 8px;
            padding-top: 10px;
            border-top: 1px solid var(--line);
        }
        .custom-presets-title {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .save-preset-row {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        .save-preset-input {
            flex: 1;
            padding: 7px 10px;
            background: var(--panel2);
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--text);
            font-size: 10px;
            font-family: var(--font-body);
            outline: none;
        }
        .save-preset-input:focus {
            border-color: var(--accent);
        }
        .save-preset-btn {
            padding: 7px 12px;
            border-radius: 8px;
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            font-family: var(--font-body);
            transition: var(--transition);
            white-space: nowrap;
        }
        .save-preset-btn:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 12px var(--glow);
        }
        .custom-preset-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 10px;
            background: var(--panel2);
            border: 1px solid var(--line);
            border-radius: 8px;
            margin-bottom: 4px;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        .custom-preset-item:hover {
            border-color: var(--accent);
            background: var(--line);
        }
        .custom-preset-item .delete-preset {
            color: var(--danger);
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
            opacity: 0.5;
            transition: var(--transition);
        }
        .custom-preset-item .delete-preset:hover {
            opacity: 1;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
            gap: 6px;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 20px;
            align-content: start;
            padding-right: 4px;
        }
        .filter-grid::-webkit-scrollbar {
            width: 4px;
        }
        .filter-grid::-webkit-scrollbar-thumb {
            background: var(--line2);
            border-radius: 4px;
        }
        .filter-btn {
            padding: 12px 4px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            color: var(--muted);
            transition: var(--transition);
            background: var(--panel2);
            font-family: var(--font-body);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--text);
            transform: translateY(-1px);
        }
        .filter-btn.active {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 12px var(--glow);
            transform: translateY(-1px);
        }

        /* Undo/Redo Buttons */
        .undo-redo-row {
            display: flex;
            gap: 6px;
        }
        .undo-btn, .redo-btn {
            flex: 1;
            padding: 7px 8px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--panel2);
            color: var(--muted);
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            font-family: var(--font-body);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .undo-btn:hover, .redo-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }
        .undo-btn:disabled, .redo-btn:disabled {
            opacity: 0.35;
            pointer-events: none;
        }

        /* CANVAS */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            background-image: radial-gradient(var(--line2) 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: center;
        }
        .canvas-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            border-radius: 10px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), 0 0 0 1px var(--line2);
            overflow: hidden;
        }
        .canvas-wrap canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            box-shadow: none;
            border-radius: 0;
        }
        .image-info-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--panel);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--line2);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            color: var(--muted);
            font-family: var(--font-body);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 10;
            pointer-events: none;
            display: flex;
            gap: 8px;
            align-items: center;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.4s ease;
        }
        .image-info-badge.show {
            opacity: 1;
            transform: translateY(0);
        }
        .image-info-badge i {
            color: var(--accent);
        }

        /* COMPARE */
        .compare-clip {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            overflow: hidden;
        }
        .compare-clip canvas {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: auto;
            max-width: none;
        }
        .compare-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--text);
            pointer-events: none;
            z-index: 5;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px var(--glow);
        }
        .compare-knob {
            position: absolute;
            top: 50%;
            width: 38px;
            height: 38px;
            background: var(--text);
            border-radius: 50%;
            z-index: 6;
            pointer-events: none;
            display: grid;
            place-items: center;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .compare-knob::after {
            content: '↔';
            font-size: 13px;
            color: var(--bg);
            font-weight: 700;
        }

        /* DROP ZONE */
        .drop-zone {
            text-align: center;
            cursor: pointer;
            padding: 40px 24px;
            border: 2px dashed var(--line2);
            border-radius: var(--radius);
            background: var(--panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: var(--transition);
            width: 100%;
            max-width: 360px;
        }
        .drop-zone:hover {
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--glow);
        }
        .drop-zone i {
            font-size: 44px;
            color: var(--accent);
            margin-bottom: 12px;
            animation: floatIcon 3s ease-in-out infinite;
            filter: drop-shadow(0 0 8px var(--glow));
        }
        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        .drop-zone h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
            font-family: var(--font-display);
        }
        .drop-zone p {
            font-size: 11px;
            color: var(--muted);
            margin: 0;
        }

        /* LOADER */
        .loader-overlay {
            position: absolute;
            inset: 0;
            background: rgba(5,5,15,0.9);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 30;
            flex-direction: column;
            gap: 14px;
            border-radius: 10px;
        }
        .loader-overlay.show {
            display: flex;
        }
        .loader-ring {
            width: 56px;
            height: 56px;
            border: 3px solid transparent;
            border-top-color: var(--accent);
            border-bottom-color: var(--accent2);
            border-radius: 50%;
            animation: spin 0.7s cubic-bezier(0.68,-0.55,0.27,1.55) infinite;
            box-shadow: 0 0 18px var(--glow2);
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loader-text {
            font-size: 10px;
            color: var(--muted);
            font-weight: 500;
            letter-spacing: 0.4px;
        }

        /* FLOATING DOCK */
        .floating-dock {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            background: var(--panel);
            padding: 6px 12px;
            border-radius: 26px;
            border: 1px solid var(--line2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 20;
            box-shadow: var(--shadow);
        }
        .dock-btn {
            padding: 8px 14px;
            border-radius: 20px;
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-body);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .dock-btn:hover {
            color: var(--text);
            background: var(--panel2);
        }
        .dock-btn:active {
            transform: scale(0.93);
            box-shadow: 0 0 14px var(--glow);
        }
        .dock-btn.primary {

                                h = State.img.naturalHeight; if (Math.max(w, h) > previewMax) { if (w > h) { w =
                                        previewMax;
                                    h = Math.round(w / r); } else { h = previewMax;
                                    w = Math.round(h * r); } } const c = document.createElement("canvas");
                            c.width = w;
                            c.height = h; const x = c.getContext("2d", { willReadFrequently: true });
                            x.drawImage(State.img, 0, 0, w, h); let d = x.getImageData(0, 0, w, h),
                                p = d.data; const br = +$("#brightness").value / 100,
                                co = +$("#contrast").value,
                                sh = +$("#sharp").value / 100,
                                den = +$("#noise").value / 100,
                                sa = +$("#sat").value / 100,
                                de = +$("#deblur").value / 100,
                                intensity = (+$("#intensity").value || 70) / 100; const cf = (259 * (co + 255)) / (
                                    255 * (259 - co)); for (let i = 0; i < p.length; i += 4) { let r2 = p[i] * br,
                                    g2 = p[i + 1] * br,
                                    b2 = p[i + 2] * br;

                                g2 = cf * (g2 - 128) + 128;

                                r2 = av + (r2 - av) * (1 + sa);
                                g2 = av + (g2 - av) * (1 + sa);

                                p[i] = clamp(r2);
                                p[i + 1] = clamp(g2);
                                p[i + 2] = clamp(b2); } if (den > .01) { const src = new Uint8ClampedArray(p),
                                        rad = den > .5 ? 2 : 1; for (let y = rad; y < h - rad; y++) for (let xx =

                applyPreset(p, id, intensity) {

                                break;

                                g = mix(g, g * 1.05);
                                b = mix(b, b * 0.86);
                                break;
                            case "Soft":

                                g = mix(g, g * 0.9 + 22);
                                b = mix(b, b * 0.9 + 22);
                                break;

                <div class="slider-wrap"><label>Contrast <span id="vc3">${$("#contrast").value}</span></label><input id="contrast3" type="range" min="-30" max="60" value="${$("#contrast").value}"></div>
                <div class="slider-wrap"><label>Sharpness <span id="vs3">${$("#sharp").value}</span></label><input id="sharp3" type="range" min="0" max="100" value="${$("#sharp").value}"></div>
                <button class="mob-btn primary" style="width:100%;margin-top:12px;padding:12px;" id="sheetClose">Done</button>`;
                bottomSheet.classList.add("show");
                $("#sheetClose").onclick = () => bottomSheet.classList.remove("show");
                ["brightness3", "contrast3", "sharp3"].forEach(id => { const target = id.replace("3", ""),
                        labelMap = { brightness3: "vb", contrast3: "vc", sharp3: "vs" };
                    $("#" + id).oninput = e => { $("#" + target).value = e.target.value;
                        $("#" + labelMap[id]).textContent = e.target.value;
                        clearTimeout(sliderDebounce);
                        sliderDebounce = setTimeout(() => { if (State.ready) Engine.process(false); }, 300); }; }); };
            $("#mobFilters").onclick = () => { bottomSheet.innerHTML = `
                <div class="section-label">Presets Library</div>
                <input class="filter-search" id="filterSearchMob" placeholder="Search filters..." style="margin-bottom:8px;">
                <div class="cat-row" id="catChipsMob" style="margin-bottom:8px;">${cats.map(c=>`<button class="cat-chip ${c===activeCat?'active':''}" data-c="${c}">${c}</button>`).join("")}</div>
                <div class="filter-grid" id="filterGridMob" style="max-height:35vh;display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;">${allPresets.filter(p=>activeCat==="all"||p.cat===activeCat).map(p=>`<button class="filter-btn ${p.name===State.activeFilter?'active':''}" data-f="${p.name}">${p.name}</button>`).join("")}</div>
                <button class="mob-btn primary" style="width:100%;margin-top:10px;padding:12px;" id="sheetClose">Done</button>`;
                bottomSheet.classList.add("show");
                $("#sheetClose").onclick = () => bottomSheet.classList.remove("show");
                $$("#catChipsMob .cat-chip").forEach(b => b.onclick = () => { activeCat = b.dataset.c;
                    $("#mobFilters").click(); });
                $$("#filterGridMob .filter-btn").forEach(b => b.onclick = () => { State.activeFilter = b.dataset.f; if (
                        State.ready) Engine.process(false);
                    bottomSheet.classList.remove("show"); });
                $("#filterSearchMob").oninput = e => { const q = e.target.value.toLowerCase();
                    $$("#filterGridMob .filter-btn").forEach(el => { el.style.display = el.textContent.toLowerCase()
                            .includes(q) ? "flex" : "none"; }); }; };

            // ═══════════════════════════════════════════
            // INIT
            // ═══════════════════════════════════════════
            $("#cameraIcon").onclick = () => { if (!State.ready) fileInput.click(); };
            document.addEventListener("keydown", e => {
                if (e.key === "Escape") { exportPopup.classList.remove("show");
                    bottomSheet.classList.remove("show"); }
                if (e.ctrlKey && e.key === "s") { e.preventDefault(); if (State.ready) Engine.download(); }
                if (e.ctrlKey && e.key === "r") { e.preventDefault();
                    pushUndo(); if (State.ready) Engine.process(true); }
                if (e.ctrlKey && e.key === "z") { e.preventDefault();
                    undo(); }
                if (e.ctrlKey && e.key === "y") { e.preventDefault();
                    redo(); }
                if (e.ctrlKey && e.key >= "1" && e.key <= "3") { e.preventDefault(); const tabs = ["adjust", "filters",
                        "export"
                    ],
                    tabName = tabs[parseInt(e.key) - 1];
                    $$(".tab-btn").forEach(b => { b.classList.toggle("active", b.dataset.tab === tabName); });
                    $$(".tab-panel").forEach(p => { p.classList.toggle("active", p.id === `tab-${tabName}`); }); }
            });
            updateUndoRedoButtons();
            console.log("✅ PIC by MC88 — Ultimate Version");
            console.log("🆕 100 Unique Presets | Undo/Redo | Custom Presets");
            console.log("© mohamed005cheikh@gmail.com | by MC88");
            console.log("⌨️ Ctrl+Z/Y Undo/Redo | Ctrl+S Save | Ctrl+R Remix | Ctrl+1/2/3 Tabs");
        })();
    </script>
</body>
</html>
